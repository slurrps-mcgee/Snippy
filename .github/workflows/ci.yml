name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            snippy/backend/package-lock.json
            snippy/frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: snippy/backend
        run: npm ci

      - name: Audit backend dependencies
        working-directory: snippy/backend
        run: npm audit --audit-level=high

      - name: Check backend formatting
        working-directory: snippy/backend
        run: npm run format:check

      - name: Typecheck backend
        working-directory: snippy/backend
        run: npx tsc --noEmit

      - name: Install frontend dependencies
        working-directory: snippy/frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: snippy/frontend
        run: npm audit --audit-level=high

      - name: Check frontend formatting
        working-directory: snippy/frontend
        run: npm run format:check

      - name: Typecheck frontend
        working-directory: snippy/frontend
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Check OpenAPI artifacts are up to date
        run: |
          npm run openapi:export --prefix snippy/backend
          npm run openapi:generate --prefix snippy/frontend
          git diff --exit-code -- documentation/openapi.json snippy/frontend/src/app/api/openapi.json snippy/frontend/src/app/api/generated/

      - name: Build backend
        working-directory: snippy/backend
        run: npm run build

      - name: Build frontend (production)
        working-directory: snippy/frontend
        run: npm run build -- --configuration production

      - name: Test backend
        working-directory: snippy/backend
        run: npm test
