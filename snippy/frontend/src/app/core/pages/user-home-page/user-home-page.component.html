@if (user()) {
<div class="flex h-full flex-col overflow-auto">
  <div class="page-shell">
    <app-user-identity-header
      [pictureUrl]="user()?.pictureUrl"
      [displayName]="user()?.displayName"
      [userName]="user()?.userName" />

    <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
      <mat-tab label="Snippets">
        <app-async-state class="mt-4 block" [loading]="isLoading" loadingText="Loading snippets...">
          <app-snippet-list-component class="mt-4 block" [snippets]="snippets" [total]="total"
            [pageSize]="pageSize" [pageIndex]="pageIndex" (searchChange)="handleSearch($event)"
            (pageChange)="handlePageChange($event)">
          </app-snippet-list-component>
        </app-async-state>
      </mat-tab>

      <mat-tab label="Collections">
        <app-async-state class="mt-4 block" [loading]="collectionsLoading" loadingText="Loading collections...">
          <app-collection-list class="mt-4 block" [collections]="collections" [total]="collectionsTotal"
            [pageSize]="collectionPageSize" [pageIndex]="collectionPageIndex" [showNewButton]="true"
            [showDelete]="true" (searchChange)="handleCollectionSearch($event)"
            (pageChange)="handleCollectionPageChange($event)" (createNew)="openCreateCollection()"
            (openCollection)="openCollection($event)" (deleteCollection)="deleteCollection($event)">
          </app-collection-list>
        </app-async-state>
      </mat-tab>

      <mat-tab label="Favorites">
        <app-async-state class="mt-4 block" [loading]="favoritesLoading" loadingText="Loading favorites...">
          <app-snippet-list-component class="mt-4 block" [snippets]="favorites" [total]="favoritesTotal"
            [pageSize]="favoritesPageSize" [pageIndex]="favoritesPageIndex" [showNewButton]="false"
            (searchChange)="handleFavoritesSearch($event)" (pageChange)="handleFavoritesPageChange($event)">
          </app-snippet-list-component>
        </app-async-state>
      </mat-tab>

      <mat-tab label="Projects">
        <div class="glass-card mt-4 text-center text-slate-400">
          <p>Projects feature coming soon!</p>
        </div>
      </mat-tab>
    </mat-tab-group>
  </div>
</div>
} @else {
<app-async-state [loading]="true" loadingText="Loading user data..." />
}
