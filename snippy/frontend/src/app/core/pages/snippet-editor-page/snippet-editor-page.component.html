<div class="d-flex flex-column h-100">
  @if (snippetStoreService.loading()) {
    <div class="d-flex align-items-center justify-content-center h-100">Loading snippet...</div>
  } @else if (error) {
    <div class="d-flex align-items-center justify-content-center h-100">{{ error }}</div>
  } @else if (snippetStoreService.snippet()) {
    <header class="d-flex align-items-center p-3 justify-content-between flex-shrink-0">
      <div class="d-flex align-items-center gap-3">
        <a [routerLink]="['/home']"><h2>Snippy</h2></a>
        <mat-form-field appearance="outline" class="w-auto">
          <input matInput [ngModel]="snippetStoreService.snippet()!.name" 
            (ngModelChange)="onSnippetNameChange($event)"
            placeholder="Snippet name">
          <mat-icon matSuffix>mode_edit</mat-icon>
        </mat-form-field>
      </div>

      <div class="d-flex align-items-center gap-3">
        <button mat-raised-button color="primary" 
          (click)="snippetSaveUIService.saveSnippetWithUI(snippetStoreService, user)"
          [disabled]="!snippetStoreService.isDirty()">
          <mat-icon>save</mat-icon>
          {{ snippetStoreService.isDirty() ? 'Save Changes' : 'Saved' }}
        </button>

        <button mat-icon-button (click)="openSettings()">
          <mat-icon>settings</mat-icon>
        </button>

        <app-user-menu></app-user-menu>
      </div>
    </header>

    <app-snippet-web-view class="flex-grow-1 overflow-hidden" #editor></app-snippet-web-view>
  }
</div>
