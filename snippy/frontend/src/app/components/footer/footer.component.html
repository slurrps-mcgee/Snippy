<footer class="site-footer" [class.editor-footer]="!!snippetStoreService.snippet()?.snippetId">
  <div class="page-container footer-inner">
    @if (snippetStoreService.snippet()?.snippetId) {
    <div class="editor-actions">
      <button mat-button (click)="forkSnippet()" matTooltip="Fork this snippet">
        <mat-icon>fork_right</mat-icon>
        Fork
      </button>
      <button mat-button (click)="exportZip()" matTooltip="Download HTML/CSS/JS as ZIP">
        <mat-icon>download</mat-icon>
        Export
      </button>
      <button mat-button (click)="openAssets()" matTooltip="Manage assets">
        <mat-icon>perm_media</mat-icon>
        Assets
      </button>
    </div>
    } @else {
    <div class="footer-meta">
      <span class="copyright">© 2026 Snippy. All rights reserved.</span>
      <nav class="footer-links" aria-label="Legal and project links">
        <a routerLink="/privacy">Privacy Policy</a>
        <a routerLink="/terms">Terms</a>
        <a [href]="licenseUrl" target="_blank" rel="noopener noreferrer">License</a>
        <a [href]="githubUrl" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
    </div>
    }
  </div>
</footer>
