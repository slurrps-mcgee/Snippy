<div class="sort-page-header">
  <h1 class="sort-page-header__title">{{ title }}</h1>

  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="sort-page-header__select">
    <mat-label>Sort by</mat-label>
    <mat-select [value]="sort" (selectionChange)="sortChange.emit($event.value)">
      @for (option of sortOptions; track option.value) {
      <mat-option [value]="option.value">{{ option.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</div>
