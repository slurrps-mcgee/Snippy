@if (variant === 'card') {
<div class="flex flex-wrap gap-1">
  <button matButton="tonal" class="stat-btn" matTooltip="Views" matTooltipPosition="above"
    (click)="$event.stopPropagation()" disabled>
    <mat-icon>visibility</mat-icon>
    <span>{{ stats.viewCount }}</span>
  </button>
  @if (stats.embedCount != null) {
  <button matButton="tonal" class="stat-btn" matTooltip="Embeds" matTooltipPosition="above"
    (click)="$event.stopPropagation()" disabled>
    <mat-icon>code</mat-icon>
    <span>{{ stats.embedCount }}</span>
  </button>
  }
  <button matButton="tonal" class="stat-btn" [matTooltip]="stats.isFavorited ? 'Unfavorite' : 'Favorite'"
    matTooltipPosition="above" (click)="favorite.emit($event)">
    <mat-icon>{{ stats.isFavorited ? 'favorite' : 'favorite_border' }}</mat-icon>
    <span>{{ stats.favoriteCount }}</span>
  </button>
  <button matButton="tonal" class="stat-btn" matTooltip="Comments" matTooltipPosition="above"
    (click)="comment.emit($event)">
    <mat-icon>comment</mat-icon>
    <span>{{ stats.commentCount }}</span>
  </button>
</div>
} @else {
<div class="flex items-center gap-1">
  <button mat-icon-button [matTooltip]="stats.isFavorited ? 'Unfavorite' : 'Favorite'"
    (click)="favorite.emit($event)">
    <mat-icon>{{ stats.isFavorited ? 'favorite' : 'favorite_border' }}</mat-icon>
  </button>
  <button mat-icon-button matTooltip="Comments" (click)="comment.emit($event)">
    <mat-icon>comment</mat-icon>
  </button>
  @if (showFork) {
  <button mat-icon-button matTooltip="Fork" (click)="fork.emit($event)">
    <mat-icon>fork_right</mat-icon>
  </button>
  }
</div>
}
