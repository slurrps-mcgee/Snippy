<button [matMenuTriggerFor]="beforeMenu"
  class="rounded-full border border-white/15 bg-transparent p-0.5 transition hover:border-violet-400/60">
  @if (user()) {
  <img [src]="user()?.pictureUrl" alt="Menu" width="40" height="40" class="rounded-full object-cover" />
  } @else {
  <span class="px-3 py-2 text-sm text-slate-200">Menu</span>
  }
</button>
<mat-menu #beforeMenu="matMenu" xPosition="before">
  <button mat-menu-item (click)="home()">Home</button>
  <button mat-menu-item (click)="profile()">Profile</button>
  <button mat-menu-item (click)="createNewSnippet()">New Snippet</button>
  <button mat-menu-item (click)="assets()">Assets</button>
  <button mat-menu-item (click)="settings()">Settings</button>
  <button mat-menu-item (click)="logout()">Log out</button>
</mat-menu>
