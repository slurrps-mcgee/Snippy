<h2 mat-dialog-title>Snippet Settings</h2>

<mat-dialog-content>
  <mat-tab-group>
    <mat-tab label="General">
      <div class="flex flex-col gap-4 pt-3">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Description</mat-label>
          <textarea matInput [(ngModel)]="description" placeholder="Describe your snippet..." rows="3">
      </textarea>
        </mat-form-field>

        <div class="flex items-center justify-between gap-4">
          <div>
            <div class="font-semibold text-slate-100">Private Snippet</div>
            <small class="text-slate-500">Only you can view this snippet</small>
          </div>
          <mat-slide-toggle [(ngModel)]="isPrivate"></mat-slide-toggle>
        </div>

        <div>
          <label class="mb-2 block font-semibold text-slate-100">Tags</label>

          <div class="mb-2 flex items-center gap-2">
            <mat-form-field appearance="outline" class="flex-1">
              <mat-label>Add tag</mat-label>
              <input matInput [(ngModel)]="newTag" (keyup.enter)="addTag()" placeholder="javascript, tutorial, etc.">
            </mat-form-field>
            <button mat-raised-button color="primary" (click)="addTag()">
              <mat-icon>add</mat-icon>
              Add
            </button>
          </div>

          @if (tags.length > 0) {
          <mat-chip-set>
            @for (tag of tags; track tag) {
            <mat-chip (removed)="removeTag(tag)">
              {{ tag }}
              <button matChipRemove>
                <mat-icon>cancel</mat-icon>
              </button>
            </mat-chip>
            }
          </mat-chip-set>
          } @else {
          <p class="text-slate-500">No tags added</p>
          }
        </div>
      </div>
    </mat-tab>
    <mat-tab label="CSS">
      <div class="overflow-hidden pt-3">
        <app-external-resources-list
          [(resources)]="cssResources"
          [resourceType]="'css'">
        </app-external-resources-list>
      </div>
    </mat-tab>
    <mat-tab label="JS">
      <div class="overflow-hidden pt-3">
        <app-external-resources-list
          [(resources)]="jsResources"
          [resourceType]="'js'">
        </app-external-resources-list>
      </div>
    </mat-tab>
  </mat-tab-group>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSave()">Save</button>
</mat-dialog-actions>
