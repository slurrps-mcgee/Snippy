<div class="d-flex flex-column h-100 overflow-hidden">
  <!-- Main vertical split: editors top, preview bottom -->
  <as-split direction="vertical" unit="percent" [gutterSize]="16" class="h-100">
    
    <!-- Top: three resizable editors -->
    <as-split-area size="50" [minSize]="0">
      <as-split direction="horizontal" unit="percent" [gutterSize]="16" class="h-100">
        <!-- HTML Editor -->
        <as-split-area size="33" [minSize]="0">
          <app-snippet-editor
            [editorType]="'html'">
          </app-snippet-editor>
        </as-split-area>

        <!-- CSS Editor -->
        <as-split-area size="33" [minSize]="0">
          <app-snippet-editor
            [editorType]="'css'">
          </app-snippet-editor>
        </as-split-area>

        <!-- JS Editor -->
        <as-split-area size="34" [minSize]="0">
          <app-snippet-editor
            [editorType]="'js'">
          </app-snippet-editor>
        </as-split-area>
      </as-split>
    </as-split-area>

    <!-- Bottom: Live Preview -->
    <as-split-area size="50" [minSize]="0">
      <app-snippet-preview></app-snippet-preview>
    </as-split-area>
    
  </as-split>
</div>
