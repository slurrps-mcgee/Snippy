server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Named location so try_files fallback to index.html keeps these headers
    # (internal redirect would not inherit add_header).
    location / {
        include /etc/nginx/nginx-app-headers.inc;
        try_files $uri @spa;
    }

    location @spa {
        include /etc/nginx/nginx-app-headers.inc;
        rewrite ^ /index.html break;
    }

    location /embed/ {
        include /etc/nginx/nginx-embed-headers.inc;
        try_files $uri @embed_spa;
    }

    location @embed_spa {
        include /etc/nginx/nginx-embed-headers.inc;
        rewrite ^ /index.html break;
    }

    location /api/ {
        client_max_body_size 6m;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No MinIO block here
}
