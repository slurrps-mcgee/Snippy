  db:
    image: mysql:8.0
    container_name: snippy-db
    env_file:
      - ./.env
    volumes:
      - mysql-data:/var/lib/mysql
      - ./snippy/db/init.sh:/docker-entrypoint-initdb.d/init.sh
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./snippy/backend
      dockerfile: Dockerfile.dev

    working_dir: /app

    volumes:
      - ./snippy/backend:/app
      - /app/node_modules

    command: npm run dev

    ports:
      - "${API_PORT:-3000}:3000"

    env_file:
      - ./.env

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./snippy/frontend
      dockerfile: Dockerfile.dev

    working_dir: /app

    volumes:
      - ./snippy/frontend:/app
      - /app/node_modules

    entrypoint: ["/entrypoint.dev.sh"]
    command:
      - ng
      - serve
      - --host
      - 0.0.0.0
      - --poll
      - "1000"
      - --proxy-config
      - proxy.conf.json

    ports:
      - "4200:4200"

    environment:
      CHOKIDAR_USEPOLLING: "true"

    env_file:
      - ./.env

    depends_on:
      - api

volumes:
  mysql-data:
  # minio_data:
