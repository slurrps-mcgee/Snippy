# Local development only. Production images are built by GitHub Actions
# and deployed via Docker Hub (kennyl777/snippy-*).

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ./.env
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 3s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  minio-init:
    build: ./snippy/minio
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ./.env
    restart: "no"

  db:
    image: mysql:8.0
    container_name: snippy-db
    env_file:
      - ./.env
    volumes:
      - mysql-data:/var/lib/mysql
      - ./snippy/db/init.sh:/docker-entrypoint-initdb.d/init.sh
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./snippy/backend
      dockerfile: Dockerfile.dev

    working_dir: /app

    volumes:
      - ./snippy/backend:/app
      - /app/node_modules

    command: npm run dev

    ports:
      - "${API_PORT:-3000}:3000"

    env_file:
      - ./.env

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./snippy/frontend
      dockerfile: Dockerfile.dev

    working_dir: /app

    volumes:
      - ./snippy/frontend:/app
      - /app/node_modules

    entrypoint: ["/bin/sh", "/app/entrypoint.dev.sh"]
    command:
      - ng
      - serve
      - --host
      - 0.0.0.0
      - --poll
      - "1000"
      - --proxy-config
      - proxy.conf.json

    ports:
      - "4200:4200"

    environment:
      CHOKIDAR_USEPOLLING: "true"

    env_file:
      - ./.env

    depends_on:
      - api

volumes:
  mysql-data:
  minio_data:
